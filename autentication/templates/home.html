{% extends 'base.html' %}

{% block title %}Página Inicial{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="jumbotron bg-dark text-white border border-warning">
        <h1 class="display-4">Olá, <span class="font-degrade">{{user.username}}</span>!</h1>
        <p class="lead">Você está logado com sucesso no sistema.</p>
        <hr class="my-4 border-secondary">
        <p>Seu e-mail de acesso é: <strong>{{user.email}}</strong></p>
        <p>Seu nível de acesso: <strong>{{user.tipo}}</strong></p>
        
        <div class="mt-4">
            <a href="{% url 'logout' %}" class="btn btn-danger btn-lg">Sair do Sistema</a>
        </div>
    </div>
</div>
{% endblock %}
