<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Freelancer{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>

<body class="fundo">
  
  {% if user.is_authenticated %}
   <nav style="background-color: #444;" class="navbar navbar-expand-lg navbar-dark">
      <div class="container"> <a class="navbar-brand" href="#"><span class="font-degrade-nav">FreelaWay</span></a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto"> 
            <li class="nav-item active">
              <a class="nav-link" href="{% url 'encontrar_jobs' %}">Encontrar job's</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-danger" href="{% url 'logout' %}">Sair</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  {% endif %}

  <style>
.font-degrade-nav{
    background-image: linear-gradient(90deg, rgba(255,207,0,1) 0%, rgba(231,71,220,1) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    padding-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
}
</style>

  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
