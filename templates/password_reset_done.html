{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'autentication/css/recuperar.css' %}">
{% endblock %}

{% block body %}
<div class="fundo-recuperar">
    <div class="box-recuperar text-center">
        <div style="font-size: 60px; color: #ffc107; margin-bottom: 20px;">
            <i class="fas fa-paper-plane"></i>
        </div>

        <h1 class="titulo">E-mail Enviado!</h1>
        
        <p style="color: #fff; font-size: 16px; margin-top: 20px;">
            Enviamos as instruções para a redefinição de senha para o seu e-mail.
        </p>
        
        <p style="color: #bbb; font-size: 14px;">
            Se não encontrar em alguns minutos, verifique sua <strong>caixa de spam</strong>.
        </p>

        <hr style="border-color: #555; margin: 30px 0;">

        <a href="{% url 'login' %}" class="btn btn-warning btn-block font-weight-bold" style="height: 48px; padding-top: 10px;">
            VOLTAR PARA O LOGIN
        </a>
    </div>
</div>
{% endblock %}
