{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'autentication/css/cadastro.css' %}">
{% endblock %}

{% block body %}
<div class="fundo">
    <div class="box">

        <h1 class="titulo font-degrade borda-bottom-degrade">
            RECUPERAR SENHA
        </h1>

        <p style="color: #bbb; font-size: 14px; text-align: center; margin-bottom: 20px;">
            Informe seu e-mail para receber o link de redefinição.
        </p>

        <form method="POST">
            {% csrf_token %}

            <span class="span-descricao">E-mail</span>
            <input
                type="email"
                name="email"
                class="form-control input-cadastro"
                placeholder="email..."
                required
            >

            <input
                type="submit"
                value="ENVIAR LINK"
                class="btn btn-success btn-lg w-100 mt-3"
            >

            <a
                href="{% url 'login' %}"
                class="btn btn-secondary btn-lg w-100 mt-2"
            >
                VOLTAR PARA O LOGIN
            </a>

        </form>
    </div>
</div>
{% endblock %}
