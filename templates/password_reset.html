{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'autentication/css/recuperar.css' %}">
{% endblock %}

{% block body %}
<div class="fundo-recuperar">
    <div class="box-recuperar">
        <h1 class="titulo">Recuperar</h1>
        
        <p class="text-center" style="color: #bbb; font-size: 14px;">
            Insira seu e-mail abaixo para redefinir sua senha.
        </p>

        <form method="POST"> {% csrf_token %}
            <label class="label-recuperar">E-mail de cadastro:</label>
            <input type="email" name="email" class="form-control input-recuperar" placeholder="Digite seu email de cadastro..." required>
            
            <button type="submit" class="btn btn-warning btn-block font-weight-bold" style="height: 48px;">
                ENVIAR LINK DE ACESSO
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" style="color: #999; text-decoration: none; font-size: 13px;">
                <i class="fas fa-arrow-left"></i> Voltar para o login
            </a>
        </div>
    </div>
</div>
{% endblock %}
