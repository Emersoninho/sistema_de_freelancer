{% extends 'base.html' %}
{% load static %}
{% load widget_tweaks %}


{% block head %}
<link rel="stylesheet" href="{% static 'autentication/css/recuperar.css' %}">
{% endblock %}

{% block body %}
<div class="fundo-recuperar">
    <div class="box-recuperar">
        <h1 class="titulo-recuperar font-degrade borda-bottom-degrade">
            Nova senha
        </h1>

        <form method="POST">
            {% csrf_token %}

            <label class="label-recuperar">Nova senha</label>
            {{ form.new_password1|add_class:"input-recuperar" }}

            <label class="label-recuperar">Confirmar senha</label>
            {{ form.new_password2|add_class:"input-recuperar" }}

            <button type="submit" class="btn btn-success btn-lg w-100 mt-3">
                ALTERAR SENHA
            </button>
        </form>
    </div>
</div>
{% endblock %}
