{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'autentication/css/recuperar.css' %}">
{% endblock %}

{% block body %}
<div class="fundo-recuperar">
    <div class="box-recuperar text-center">
        <div style="font-size: 60px; color: #28a745; margin-bottom: 20px;">
            <i class="fas fa-check-circle"></i>
        </div>

        <h1 class="titulo">Tudo Pronto!</h1>
        
        <p style="color: #fff; font-size: 18px; margin-top: 20px;">
            Sua senha foi redefinida com sucesso.
        </p>
        
        <p style="color: #bbb; font-size: 14px; margin-bottom: 30px;">
            Agora você já pode acessar sua conta com a nova senha que criou.
        </p>

        <a href="{% url 'login' %}" class="btn btn-warning btn-block font-weight-bold" style="height: 48px; padding-top: 10px;">
            FAZER LOGIN AGORA
        </a>
    </div>
</div>
{% endblock %}
